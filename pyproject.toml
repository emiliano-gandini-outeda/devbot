[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-management-bot"
version = "1.0.0"
description = "A comprehensive Discord management bot with ticket system, GitHub integration, and automation features"
authors = [{name = "Discord Bot", email = "bot@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "discord.py==2.3.2",
    "asyncpg==0.29.0",
    "aiohttp==3.9.1",
    "python-dotenv==1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/discord-management-bot"
Repository = "https://github.com/yourusername/discord-management-bot"
Issues = "https://github.com/yourusername/discord-management-bot/issues"
